name: Deploy Demo Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-demo-stack
  cancel-in-progress: false

env:
  COMPOSE_PROJECT_NAME: demo
  COMPOSE_FILE: docker-compose.yml
  APP_LABEL: demo
  DOCKERHUB_USERNAME: s5carles
  IMAGE_TAG: ${{ github.sha }}
  DOCKER_HOST: unix:///var/run/docker.sock

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 — Build & Push to Docker Hub
  # ═══════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: [self-hosted, demo]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 1. INSTALL DOCKER + COMPOSE IF MISSING
      # ─────────────────────────────────────────────
      - name: Ensure Docker & Compose are installed
        run: |
          set -e

          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            echo "✅ Docker & Compose already installed"
            docker --version
            docker compose version
            exit 0
          fi

          echo "⚠️  Docker or Compose missing — installing from official repo..."

          # Install prerequisites
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release

          # Add Docker's official GPG key
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
            sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg

          # Add the Docker repo
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          # Install Docker Engine + Compose plugin + Buildx
          sudo apt-get update
          sudo apt-get install -y \
            docker-ce \
            docker-ce-cli \
            containerd.io \
            docker-buildx-plugin \
            docker-compose-plugin

          # Enable + start Docker
          sudo systemctl enable docker
          sudo systemctl start docker

          # Verify
          docker --version
          docker compose version
          echo "✅ Docker & Compose installed successfully"

      # ─────────────────────────────────────────────
      # 2. FIX DOCKER SOCKET PERMISSIONS
      # ─────────────────────────────────────────────
      - name: Fix Docker socket permissions
        run: |
          echo "== Current user & groups =="
          whoami
          id

          sudo usermod -aG docker "$USER" || true
          sudo chown root:docker /var/run/docker.sock || true
          sudo chmod 660 /var/run/docker.sock || true

          ls -l /var/run/docker.sock || true

      - name: Verify Docker & Compose access
        run: |
          docker --version
          docker compose version
          docker info > /dev/null && echo "✅ Docker daemon accessible"
          docker ps && echo "✅ Docker socket accessible"

      # ─────────────────────────────────────────────
      # 3. AUTHENTICATE TO DOCKER HUB
      # ─────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # 4. BUILD WITH TAGS
      # ─────────────────────────────────────────────
      - name: Build UI image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/ui:latest \
            -t ${{ env.DOCKERHUB_USERNAME }}/ui:${{ env.IMAGE_TAG }} \
            ./ui

      - name: Build Auth image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/auth:latest \
            -t ${{ env.DOCKERHUB_USERNAME }}/auth:${{ env.IMAGE_TAG }} \
            ./auth

      - name: Build Weather image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/weather:latest \
            -t ${{ env.DOCKERHUB_USERNAME }}/weather:${{ env.IMAGE_TAG }} \
            ./weather

      # ─────────────────────────────────────────────
      # 5. PUSH TO DOCKER HUB
      # ─────────────────────────────────────────────
      - name: Push all images
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/ui:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/ui:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/auth:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/auth:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/weather:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/weather:${{ env.IMAGE_TAG }}

      - name: Show pushed images
        run: |
          docker images --filter "reference=${{ env.DOCKERHUB_USERNAME }}/*" \
            --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

  # ═══════════════════════════════════════════════════════════
  # JOB 2 — Deploy
  # ═══════════════════════════════════════════════════════════
  deploy:
    name: Deploy Demo Stack
    needs: build-and-push
    runs-on: [self-hosted, demo]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 1. INSTALL DOCKER + COMPOSE IF MISSING
      # ─────────────────────────────────────────────
      - name: Ensure Docker & Compose are installed
        run: |
          set -e

          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            echo "✅ Docker & Compose already installed"
            docker --version
            docker compose version
            exit 0
          fi

          echo "⚠️  Docker or Compose missing — installing from official repo..."

          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release

          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
            sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg

          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          sudo apt-get update
          sudo apt-get install -y \
            docker-ce \
            docker-ce-cli \
            containerd.io \
            docker-buildx-plugin \
            docker-compose-plugin

          sudo systemctl enable docker
          sudo systemctl start docker

          docker --version
          docker compose version
          echo "✅ Docker & Compose installed successfully"

      # ─────────────────────────────────────────────
      # 2. FIX DOCKER SOCKET PERMISSIONS
      # ─────────────────────────────────────────────
      - name: Fix Docker socket permissions
        run: |
          whoami
          id
          sudo usermod -aG docker "$USER" || true
          sudo chown root:docker /var/run/docker.sock || true
          sudo chmod 660 /var/run/docker.sock || true
          ls -l /var/run/docker.sock || true

      - name: Verify Docker & Compose access
        run: |
          docker --version
          docker compose version
          docker info > /dev/null && echo "✅ Docker daemon accessible"
          docker ps && echo "✅ Docker socket accessible"

      # ─────────────────────────────────────────────
      # 3. LOG IN TO DOCKER HUB
      # ─────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # 4. WRITE .env FROM SECRETS
      # ─────────────────────────────────────────────
      - name: Write .env file
        run: |
          cat <<EOF > .env
          DOCKERHUB_USERNAME=${{ env.DOCKERHUB_USERNAME }}
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          APP_LABEL=demo
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          WEATHER_APIKEY=${{ secrets.WEATHER_APIKEY }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          EOF

      - name: Validate compose file
        run: docker compose -p demo -f docker-compose.yml config

      - name: Tear down existing stack
        run: |
          docker compose -p demo -f docker-compose.yml down --remove-orphans || true

      - name: Pull latest images from Docker Hub
        run: |
          docker compose -p demo -f docker-compose.yml pull --ignore-pull-failures || true

      - name: Deploy stack
        run: |
          docker compose -p demo -f docker-compose.yml up -d --remove-orphans

      - name: Wait for services
        run: |
          sleep 15
          docker compose -p demo -f docker-compose.yml ps

      - name: Health check (UI)
        run: |
          for i in {1..12}; do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              echo "✅ UI healthy"; exit 0
            fi
            echo "⏳ UI attempt $i..."; sleep 5
          done
          echo "❌ UI health check failed"; exit 1

      - name: Health check (Auth)
        run: |
          for i in {1..12}; do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "✅ Auth healthy"; exit 0
            fi
            echo "⏳ Auth attempt $i..."; sleep 5
          done
          echo "❌ Auth health check failed"; exit 1

      - name: Show running containers
        if: always()
        run: |
          docker ps --filter "label=app=demo" \
            --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

      - name: Dump logs on failure
        if: failure()
        run: docker compose -p demo -f docker-compose.yml logs --tail=200

      - name: Prune old images
        if: always()
        run: docker image prune -f