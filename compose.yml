services:

  ui:
    image: ${DOCKERHUB_USERNAME:-s5carles}/ui:${IMAGE_TAG:-latest}
    container_name: demo-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AUTH_HOST: auth
      AUTH_PORT: 8080
      WEATHER_HOST: weather
      WEATHER_PORT: 5000
      REDIS_USER: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    labels:
      - "app=demo"
      - "com.demo.service=ui"
    depends_on:
      auth:
        condition: service_started
      weather:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - demo-net

  auth:
    image: ${DOCKERHUB_USERNAME:-s5carles}/auth:${IMAGE_TAG:-latest}
    container_name: demo-auth
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_USER: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    labels:
      - "app=demo"
      - "com.demo.service=auth"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - demo-net

  weather:
    image: ${DOCKERHUB_USERNAME:-s5carles}/weather:${IMAGE_TAG:-latest}
    container_name: demo-weather
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      APIKEY: ${WEATHER_APIKEY}
    labels:
      - "app=demo"
      - "com.demo.service=weather"
    networks:
      - demo-net

  db:
    image: mysql:8.0
    container_name: demo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: demo
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    labels:
      - "app=demo"
      - "com.demo.service=db"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - demo-net

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis}
      --user redis on >${REDIS_PASSWORD:-redis} ~* +@all
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    labels:
      - "app=demo"
      - "com.demo.service=redis"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - demo-net

volumes:
  db-data:
    name: demo-db-data
  redis-data:
    name: demo-redis-data

networks:
  demo-net:
    name: demo-net
    driver: bridge
    labels:
      - "app=demo"