services:
  ui:
    build:
      context: ./UI
    container_name: carles-weatherapp-ui
    environment:
      AUTH_HOST: auth
      AUTH_PORT: "8080"
      WEATHER_HOST: weather
      WEATHER_PORT: "5000"
    ports:
      - "3000:3000"
    depends_on:
      auth:
        condition: service_healthy
      weather:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  auth:
    build:
      context: ./auth
    container_name: carles-weatherapp-auth
    environment:
      DB_HOST: db
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-weatherapp-root-password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  weather:
    build:
      context: ./weather
    container_name: carles-weatherapp-weather
    environment:
      APIKEY: ${APIKEY:?Set APIKEY in a .env file or export it before running docker compose}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: mysql:8.0
    container_name: carles-weatherapp-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-weatherapp-root-password}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: carles-weatherapp-redis
    volumes:
      - redis-data:/data
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-net:
    name: carles-weatherapp-net

volumes:
  db-data:
    name: carles-weatherapp-db-data
  redis-data:
    name: carles-weatherapp-redis-data
