services:

  # ─────────────────────────────────────────────
  # UI Service (frontend)
  # ─────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: demo-ui:${IMAGE_TAG:-latest}
    container_name: demo-ui
    restart: unless-stopped
    ports:
      - "3000:3000"          # adjust to the port your UI listens on
    environment:
      AUTH_HOST: auth
      AUTH_PORT: 8080
      WEATHER_HOST: weather
      WEATHER_PORT: 5000
      REDIS_USER: redis
      REDIS_PASSWORD: redis
    labels:
      - "app=demo"
      - "com.demo.managed=true"
      - "com.demo.service=ui"
    depends_on:
      auth:
        condition: service_started
      weather:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - demo-net

  # ─────────────────────────────────────────────
  # Auth Service
  # ─────────────────────────────────────────────
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    image: demo-auth:${IMAGE_TAG:-latest}
    container_name: demo-auth
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PASSWORD: my-secret-pw
      # If your auth service also uses these, they're ready:
      REDIS_USER: redis
      REDIS_PASSWORD: redis
    labels:
      - "app=demo"
      - "com.demo.managed=true"
      - "com.demo.service=auth"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - demo-net

  # ─────────────────────────────────────────────
  # Weather Service
  # ─────────────────────────────────────────────
  weather:
    build:
      context: ./weather
      dockerfile: Dockerfile
    image: demo-weather:${IMAGE_TAG:-latest}
    container_name: demo-weather
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      APIKEY: ecbc396f46mshb65cbb1f82cf334p1fcc87jsna5e962a3c542
    labels:
      - "app=demo"
      - "com.demo.managed=true"
      - "com.demo.service=weather"
    networks:
      - demo-net

  # ─────────────────────────────────────────────
  # Database Service (MySQL)
  # ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: demo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: demo
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    labels:
      - "app=demo"
      - "com.demo.managed=true"
      - "com.demo.service=db"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmy-secret-pw"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - demo-net

  # ─────────────────────────────────────────────
  # Redis Service
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: demo-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass redis
      --user redis on >redis ~* +@all
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    labels:
      - "app=demo"
      - "com.demo.managed=true"
      - "com.demo.service=redis"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - demo-net

# ─────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────
volumes:
  db-data:
    name: demo-db-data
  redis-data:
    name: demo-redis-data

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  demo-net:
    name: demo-net
    driver: bridge
    labels:
      - "app=demo"