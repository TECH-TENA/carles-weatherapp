name: Weather App Docker Compose CI/CD

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  compose-ci:
    name: Build and test Docker Compose stack
    runs-on: [self-hosted, Linux, X64, practice]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          APIKEY_VALUE="${APIKEY:-dummy-ci-key}"
          MYSQL_ROOT_PASSWORD_VALUE="${MYSQL_ROOT_PASSWORD:-weatherapp-root-password}"

          printf "APIKEY=%s\nMYSQL_ROOT_PASSWORD=%s\n" "$APIKEY_VALUE" "$MYSQL_ROOT_PASSWORD_VALUE" > .env

          {
            echo "APIKEY=${APIKEY_VALUE}"
            echo "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD_VALUE}"
          } >> "$GITHUB_ENV"
        env:
          APIKEY: ${{ secrets.APIKEY }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Docker Compose file
        run: docker compose config --quiet

      - name: Build Docker Compose images
        run: docker compose build

      - name: Push Docker images to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          docker tag carles-weatherapp-ui:latest "${DOCKER_USERNAME}/carles-weatherapp-ui:${SHORT_SHA}"
          docker tag carles-weatherapp-ui:latest "${DOCKER_USERNAME}/carles-weatherapp-ui:latest"

          docker tag carles-weatherapp-auth:latest "${DOCKER_USERNAME}/carles-weatherapp-auth:${SHORT_SHA}"
          docker tag carles-weatherapp-auth:latest "${DOCKER_USERNAME}/carles-weatherapp-auth:latest"

          docker tag carles-weatherapp-weather:latest "${DOCKER_USERNAME}/carles-weatherapp-weather:${SHORT_SHA}"
          docker tag carles-weatherapp-weather:latest "${DOCKER_USERNAME}/carles-weatherapp-weather:latest"

          docker push "${DOCKER_USERNAME}/carles-weatherapp-ui:${SHORT_SHA}"
          docker push "${DOCKER_USERNAME}/carles-weatherapp-ui:latest"

          docker push "${DOCKER_USERNAME}/carles-weatherapp-auth:${SHORT_SHA}"
          docker push "${DOCKER_USERNAME}/carles-weatherapp-auth:latest"

          docker push "${DOCKER_USERNAME}/carles-weatherapp-weather:${SHORT_SHA}"
          docker push "${DOCKER_USERNAME}/carles-weatherapp-weather:latest"

      - name: Start Docker Compose stack
        run: docker compose up -d

      - name: Wait for services to become healthy
        run: |
          for attempt in $(seq 1 30); do
            all_ready=true

            docker compose ps

            for service in ui auth weather db redis; do
              container_id="$(docker compose ps -q "$service")"

              if [ -z "$container_id" ]; then
                echo "$service container is not created yet."
                all_ready=false
                continue
              fi

              state="$(docker inspect -f '{{ .State.Status }}' "$container_id")"
              health="$(docker inspect -f '{{ if .State.Health }}{{ .State.Health.Status }}{{ else }}none{{ end }}' "$container_id")"

              echo "$service state=$state health=$health"

              if [ "$state" != "running" ]; then
                all_ready=false
              fi

              if [ "$health" != "healthy" ]; then
                all_ready=false
              fi
            done

            if [ "$all_ready" = "true" ]; then
              echo "All services are running and healthy."
              exit 0
            fi

            echo "Waiting for services to become healthy... attempt ${attempt}/30"
            sleep 10
          done

          echo "Services did not become healthy in time."
          docker compose logs
          exit 1

      - name: Test UI health endpoint
        run: curl --fail --show-error --silent http://localhost:3000/health

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v

  compose-deploy:
    name: Deploy with Docker Compose
    runs-on: [self-hosted, Linux, X64, practice]
    needs: compose-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment environment file
        run: |
          APIKEY_VALUE="${APIKEY:-dummy-ci-key}"
          MYSQL_ROOT_PASSWORD_VALUE="${MYSQL_ROOT_PASSWORD:-weatherapp-root-password}"

          printf "APIKEY=%s\nMYSQL_ROOT_PASSWORD=%s\n" "$APIKEY_VALUE" "$MYSQL_ROOT_PASSWORD_VALUE" > .env

          {
            echo "APIKEY=${APIKEY_VALUE}"
            echo "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD_VALUE}"
          } >> "$GITHUB_ENV"
        env:
          APIKEY: ${{ secrets.APIKEY }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for deployed services to become healthy
        run: |
          for attempt in $(seq 1 30); do
            all_ready=true

            docker compose ps

            for service in ui auth weather db redis; do
              container_id="$(docker compose ps -q "$service")"

              if [ -z "$container_id" ]; then
                echo "$service container is not created yet."
                all_ready=false
                continue
              fi

              state="$(docker inspect -f '{{ .State.Status }}' "$container_id")"
              health="$(docker inspect -f '{{ if .State.Health }}{{ .State.Health.Status }}{{ else }}none{{ end }}' "$container_id")"

              echo "$service state=$state health=$health"

              if [ "$state" != "running" ]; then
                all_ready=false
              fi

              if [ "$health" != "healthy" ]; then
                all_ready=false
              fi
            done

            if [ "$all_ready" = "true" ]; then
              echo "Docker Compose deployment is running and healthy."
              exit 0
            fi

            echo "Waiting for deployed services to become healthy... attempt ${attempt}/30"
            sleep 10
          done

          echo "Deployed services did not become healthy in time."
          docker compose logs
          exit 1

      - name: Test deployed UI health endpoint
        run: curl --fail --show-error --silent http://localhost:3000/health

      - name: Show deployed services
        if: always()
        run: docker compose ps

      - name: Show deployment logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop deployment stack
        if: always()
        run: docker compose down -v
